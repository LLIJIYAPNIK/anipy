name: Deploy

# Сборка образа, публикация в GHCR и перезапуск контейнера на сервере.
# Запускается при изменениях в main, вручную и по релизу SDK: репозитории SDK
# шлют repository_dispatch с типом sdk-release.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sdk-release]

# Одна выкладка за раз; новая не прерывает начатую.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/llijiyapnik/anipy

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: docker build --tag "$IMAGE:latest" --tag "$IMAGE:${{ github.sha }}" .
      - name: Push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://anipy.ru
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7

      # Пока секреты не заданы (см. docs/deploy.md), образ публикуется, а сервер не трогается.
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy secrets are not set, skipping the server update. See docs/deploy.md."
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Update the compose file
        if: steps.secrets.outputs.ready == 'true'
        run: >
          rsync -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Restart the container
        if: steps.secrets.outputs.ready == 'true'
        run: >
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST"
          "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
