name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # uv запускает griffe для справочника API (scripts/api-reference.py в npm run sync).
      # Мажорных тегов (v10) у setup-uv нет — только полные версии.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - run: npm ci
      # Контент сайта — из репозиториев SDK: без них check и build не проверяют ничего.
      - run: npm run sync
      - run: npm run check
      - run: npm run build

  # Образ, который выкладывает deploy.yml, должен собираться и отдавать страницы.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag anipy:ci .
      - name: Smoke test
        run: |
          docker run -d --name anipy --read-only --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp -p 8081:80 anipy:ci
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8081/ru/
          curl -fsS -o /dev/null http://127.0.0.1:8081/en/coverage/
          curl -fsS -o /dev/null http://127.0.0.1:8081/en/docs/py-aniliberty/reference/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/no-such-page/)" = 404
          curl -s http://127.0.0.1:8081/no-such-page/ | grep -q 'ANIPY'
