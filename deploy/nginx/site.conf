# nginx внутри контейнера: раздаёт dist/. TLS и домен — у nginx на хосте (anipy.ru.conf).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Редиректы относительные: схему и домен знает только хост.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Главная по умолчанию — русская версия.
    location = / {
        return 302 /ru/;
    }

    # Файлы сборки с хешем в имени не меняются.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        internal;
    }
    location = /500.html {
        internal;
    }
}
