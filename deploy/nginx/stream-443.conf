# Порт 443 на сервере общий: сайт anipy.ru и VPN (amnezia-xray).
# nginx читает имя сайта из TLS ClientHello (SNI), ничего не расшифровывая,
# и передаёт соединение дальше целиком: anipy.ru — в nginx с сертификатом сайта,
# всё остальное — в VPN. Блок stream — верхнего уровня, вне http {}:
# подключается строкой `include /etc/nginx/streams-enabled/*.conf;` в конце nginx.conf.
# Нужен модуль stream (в Ubuntu — пакет libnginx-mod-stream).

stream {
    map $ssl_preread_server_name $backend_443 {
        anipy.ru      anipy;
        www.anipy.ru  anipy;
        default       vpn;
    }

    # HTTPS сайта — server-блоки из anipy.ru.conf.
    upstream anipy {
        server 127.0.0.1:8443;
    }

    # amnezia-xray, опубликованный только на localhost: -p 127.0.0.1:4443:443/tcp.
    upstream vpn {
        server 127.0.0.1:4443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend_443;
    }
}
