# nginx для anipy.ru: статика из dist/, выкладываемая deploy.yml.
# Ставится в /etc/nginx/sites-available/anipy.ru, сертификат — certbot (см. docs/deploy.md).

server {
    listen 80;
    listen [::]:80;
    server_name anipy.ru www.anipy.ru;

    return 301 https://anipy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.anipy.ru;

    ssl_certificate /etc/letsencrypt/live/anipy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anipy.ru/privkey.pem;

    return 301 https://anipy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anipy.ru;

    ssl_certificate /etc/letsencrypt/live/anipy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anipy.ru/privkey.pem;

    root /var/www/anipy.ru;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Главная по умолчанию — русская версия.
    location = / {
        return 302 /ru/;
    }

    # Файлы сборки с хешем в имени не меняются.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        internal;
    }
    location = /500.html {
        internal;
    }
}
