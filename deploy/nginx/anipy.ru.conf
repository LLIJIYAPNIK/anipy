# nginx на хосте для anipy.ru: TLS и проксирование в контейнер (deploy/docker-compose.yml).
# Ставится в /etc/nginx/sites-available/anipy.ru, сертификат — certbot (см. docs/deploy.md).
# HTTP/2 — флагом в listen: директива `http2 on;` есть только с nginx 1.25.1, а в Ubuntu 22.04 стоит 1.18.
# Порт 8081 должен совпадать с ANIPY_PORT в .env проекта на сервере.

server {
    listen 80;
    listen [::]:80;
    server_name anipy.ru www.anipy.ru;

    return 301 https://anipy.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.anipy.ru;

    ssl_certificate /etc/letsencrypt/live/anipy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anipy.ru/privkey.pem;

    return 301 https://anipy.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anipy.ru;

    ssl_certificate /etc/letsencrypt/live/anipy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anipy.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
